<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Pro - Media Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #0b141a; --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: Segoe UI, sans-serif; overflow: hidden; }
        #videoContainer { position: fixed; inset: 0; bottom: 60px; background: #000; }
        #localVideo, #shortsFrame { width: 100%; height: 100%; object-fit: cover; border: none; }
        
        /* إعلان الفيديو الأولي */
        #videoAdBox { position: fixed; inset: 0; background: #000; z-index: 99999; display: none; justify-content: center; align-items: center; }
        #videoAdPlayer { width: 100%; height: 100%; object-fit: cover; }
        #adInfo { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,.7); color: #fff; padding: 10px 15px; border-radius: 10px; font-size: 14px; }
        #skipAdBtn { position: absolute; bottom: 90px; left: 20px; background: #fff; color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
        
        /* البانر السفلي */
        #adBanner { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; z-index: 99999; display: flex; justify-content: center; align-items: center; border-top: 1px solid #333; }
    </style>
</head>

<body>

<div id="videoContainer">
    <iframe id="shortsFrame" allowfullscreen allow="autoplay" style="display:none;"></iframe>
    <video id="localVideo" autoplay playsinline controls loop style="display:none;"></video>
</div>

<div id="videoAdBox">
    <video id="videoAdPlayer" autoplay muted playsinline></video>
    <div id="adInfo">إعلان ممول • <span id="skipTimer">5</span></div>
    <button id="skipAdBtn">تخطي الإعلان</button>
</div>

<div id="adBanner">
    <script type="text/javascript">
        atOptions = { 'key' : 'ecd37eb3b51978e4cf1c88fb23e69e0b', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
    </script>
    <script src="//www.highperformanceformat.com/ecd37eb3b51978e4cf1c88fb23e69e0b/invoke.js"></script>
</div>

<script>
/* =========================
   إعدادات الحماية والأمان
========================= */

// 1. تفعيل البوب اندر بعد فترة من التصفح وليس فوراً
let firstClickDone = false;
document.addEventListener("click", () => {
    if (firstClickDone) return;
    firstClickDone = true;
    
    // تأخير ظهور النافذة المنبثقة 3 ثوانٍ بعد أول ضغطة ليبدو الأمر طبيعياً
    setTimeout(() => {
        let s = document.createElement("script");
        s.src = "https://pl29310381.profitablecpmratenetwork.com/f3/f1/14/f3f11422479a989121f35119a95ea880.js";
        document.body.appendChild(s);
    }, 3000);
});

// 2. تفعيل إعلانات المشاهدة (Social Bar) بعد 10 ثوانٍ من دخول الصفحة
function startWatchAd() {
    setTimeout(() => {
        let s = document.createElement("script");
        s.src = "https://pl29310384.profitablecpmratenetwork.com/1f/4d/fc/1f4dfcd01832df6433005c331053354d.js";
        document.body.appendChild(s);
    }, 10000); 
}

// 3. تشغيل إعلان الفيديو الأولي مع حماية الوقت
function runPreRollAd(callback) {
    const adBox = document.getElementById("videoAdBox");
    const adPlayer = document.getElementById("videoAdPlayer");
    const skipBtn = document.getElementById("skipAdBtn");
    const timer = document.getElementById("skipTimer");

    adBox.style.display = "flex";
    adPlayer.src = "ads/ad1.mp4"; // تأكد من وجود ملف الفيديو

    let count = 5; // رفع الوقت لـ 5 ثوانٍ لتحسين جودة الزيارة
    const interval = setInterval(() => {
        count--;
        timer.innerText = count;
        if (count <= 0) {
            clearInterval(interval);
            skipBtn.style.display = "block";
        }
    }, 1000);

    skipBtn.onclick = () => {
        adBox.style.display = "none";
        adPlayer.pause();
        if (callback) callback();
    };
}

// 4. تحميل المحتوى الأساسي
function startExchangeContent() {
    const targetUrl = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
    const shortsFrame = document.getElementById("shortsFrame");
    const localVideo = document.getElementById("localVideo");

    if (targetUrl.includes("youtube.com") || targetUrl.includes("youtu.be")) {
        let vID = targetUrl.includes("v=") ? targetUrl.split("v=")[1].split("&")[0] : targetUrl.split("youtu.be/")[1];
        localVideo.style.display = "none";
        shortsFrame.style.display = "block";
        shortsFrame.src = `https://www.youtube-nocookie.com/embed/${vID}?autoplay=1`;
    } else {
        shortsFrame.style.display = "none";
        localVideo.style.display = "block";
        localVideo.src = targetUrl;
        localVideo.play();
    }
    
    startWatchAd();
}

window.onload = () => {
    // تشغيل الإعلانات بترتيب ذكي
    runPreRollAd(() => {
        startExchangeContent();
    });
};
</script>

</body>
</html>
