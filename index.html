<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Pro - Clean Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --bg:#0b141a;
    --panel:rgba(23,33,39,.95);
    --primary:#e2d1f9;
    --text:#fff;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,sans-serif;
    overflow:hidden;
}

#videoContainer{
    position:fixed;
    inset:0;
    background:#000;
    z-index: 1;
}

#localVideo, #shortsFrame{
    width:100%;
    height:100%;
    object-fit:cover;
    border:none;
}

/* البنر العلوي الوحيد */
#topBannerAd {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 60px;
    z-index: 10000;
    display: flex;
    justify-content: center;
    background: rgba(0,0,0,0.6);
}

/* إعلان وسط الفيديو */
#midVideoAd {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10001;
    display: none; 
    background: rgba(0,0,0,0.9);
    padding: 10px;
    border-radius: 15px;
    border: 1px solid var(--primary);
}

/* إشعارات الإعلانات */
.ad-notification {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 300px;
    background: var(--panel);
    border-right: 5px solid #00a884;
    border-radius: 10px;
    padding: 10px;
    z-index: 10002;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    display: none;
    animation: slideUp 0.5s ease-out;
}

@keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.node{
    position:fixed;
    right:20px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--panel);
    border:2px solid var(--primary);
    display:flex;
    justify-content:center;
    align-items:center;
    color:var(--primary);
    z-index:9999;
    cursor:pointer;
}

.glass{
    position:fixed;
    right:85px;
    width:220px;
    background:var(--panel);
    border:1px solid var(--primary);
    border-radius:20px;
    padding:15px;
    display:none;
    flex-direction:column;
    gap:10px;
    z-index:99999;
}

#subC{
    position:fixed;
    top:80px; 
    left:15px;
    background:rgba(0,0,0,0.5);
    padding:8px 15px;
    border-radius:20px;
    z-index:9999;
}
</style>
</head>

<body>

<div id="topBannerAd">
    <script async="async" data-cfasync="false" src="https://pl29310385.profitablecpmratenetwork.com/00e55bc0936560b403e88e60248cee97/invoke.js"></script>
    <div id="container-00e55bc0936560b403e88e60248cee97"></div>
</div>

<div id="videoContainer">
    <iframe id="shortsFrame" style="display:none;" allowfullscreen allow="autoplay"></iframe>
    <video id="localVideo" controls autoplay playsinline loop src="A.mp4.mp4"></video>
</div>

<div id="midVideoAd">
    <script>
      atOptions = {
        'key' : 'ecd37eb3b51978e4cf1c88fb23e69e0b',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/ecd37eb3b51978e4cf1c88fb23e69e0b/invoke.js"></script>
    <button onclick="document.getElementById('midVideoAd').style.display='none'" style="display:block; width:100%; margin-top:5px; background:#ff4f4f; color:white; border:none; padding:5px; border-radius:5px; cursor:pointer;">إغلاق الإعلان</button>
</div>

<div id="notifAd" class="ad-notification">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
        <strong style="color:#00a884; font-size:14px;">إشعار جديد</strong>
        <i class="fas fa-times" onclick="this.parentElement.parentElement.style.display='none'" style="cursor:pointer; font-size:12px;"></i>
    </div>
    <script src="https://pl29310381.profitablecpmratenetwork.com/f3/f1/14/f3f11422479a989121f35119a95ea880.js"></script>
</div>

<div id="subC">
    <i class="fa-solid fa-heart" style="color:#ff4f4f"></i>
    <span>1,405</span>
</div>

<div class="node" style="top:150px" onclick="UI.toggle('pSettings')">
    <i class="fas fa-video"></i>
</div>

<div id="pSettings" class="glass" style="top:150px">
    <label>رابط الفيديو:</label>
    <input type="text" id="ytUrl" placeholder="رابط يوتيوب أو mp4">
    <button onclick="App.applyMedia()" style="background:#00a884; color:white;">تشغيل 🎬</button>
</div>

<script src="https://pl29310384.profitablecpmratenetwork.com/1f/4d/fc/1f4dfcd01832df6433005c331053354d.js"></script>

<script>
const localVideo = document.getElementById("localVideo");
const shortsFrame = document.getElementById("shortsFrame");

const App = {
    applyMedia: () => {
        const input = document.getElementById("ytUrl").value.trim();
        if (!input) return;
        if (input.includes("youtube.com") || input.includes("youtu.be")) {
            let vID = input.includes("v=") ? input.split("v=")[1].split("&")[0] : 
                      input.includes("shorts/") ? input.split("shorts/")[1].split("?")[0] : 
                      input.split("youtu.be/")[1].split("?")[0];
            localVideo.style.display = "none";
            localVideo.pause();
            shortsFrame.style.display = "block";
            shortsFrame.src = `https://www.youtube-nocookie.com/embed/${vID}?autoplay=1`;
        } else {
            shortsFrame.style.display = "none";
            shortsFrame.src = "";
            localVideo.style.display = "block";
            localVideo.src = input;
            localVideo.play();
        }
        UI.hideAll();
    }
};

const UI = {
    toggle: (id) => {
        const el = document.getElementById(id);
        const isVisible = el.style.display === "flex";
        UI.hideAll();
        el.style.display = isVisible ? "none" : "flex";
    },
    hideAll: () => {
        document.querySelectorAll(".glass").forEach(el => el.style.display = "none");
    }
};

// إدارة ظهور الإعلانات بناءً على وقت الفيديو A.mp4.mp4
localVideo.ontimeupdate = () => {
    let t = localVideo.currentTime;

    // إعلان وسط الفيديو: يظهر من الثانية 15 إلى 25
    if (t >= 15 && t <= 25) {
        document.getElementById('midVideoAd').style.display = 'block';
    } else if (t > 25) {
        document.getElementById('midVideoAd').style.display = 'none';
    }

    // إعلان الإشعار: يظهر من الثانية 3 إلى 13
    if (t >= 3 && t <= 13) {
        document.getElementById('notifAd').style.display = 'block';
    } else if (t > 13) {
        document.getElementById('notifAd').style.display = 'none';
    }
};

// تشغيل الفيديو تلقائياً عند التحميل
window.onload = () => {
    localVideo.play().catch(e => console.log("التشغيل التلقائي يحتاج تفاعل مستخدم في بعض المتصفحات"));
};
</script>

</body>
</html>
