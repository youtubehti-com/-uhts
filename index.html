<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Pro - Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #0b141a; --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: Segoe UI, sans-serif; overflow: hidden; }
        
        /* البانر العلوي */
        #adBannerTop { 
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; 
            background: #000; z-index: 9999; display: flex; 
            justify-content: center; align-items: center; border-bottom: 1px solid #333; 
        }

        #videoContainer { position: fixed; inset: 0; top: 60px; background: #000; }
        #localVideo { width: 100%; height: 100%; object-fit: contain; border: none; }
        
        /* إعلان الفيديو الأولي */
        #videoAdBox { position: fixed; inset: 0; background: #000; z-index: 99999; display: none; justify-content: center; align-items: center; }
        #videoAdPlayer { width: 100%; height: 100%; object-fit: cover; }
        #adInfo { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,.7); color: #fff; padding: 10px 15px; border-radius: 10px; font-size: 14px; }
        #skipAdBtn { position: absolute; bottom: 90px; left: 20px; background: #fff; color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
    </style>
</head>

<body>

<div id="adBannerTop">
    <script type="text/javascript">
        atOptions = { 'key' : 'ecd37eb3b51978e4cf1c88fb23e69e0b', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
    </script>
    <script src="//www.highperformanceformat.com/ecd37eb3b51978e4cf1c88fb23e69e0b/invoke.js"></script>
</div>

<div id="videoContainer">
    <video id="localVideo" playsinline controls loop></video>
</div>

<div id="videoAdBox">
    <video id="videoAdPlayer" autoplay muted playsinline></video>
    <div id="adInfo">إعلان ممول • <span id="skipTimer">3</span></div>
    <button id="skipAdBtn">تخطي الإعلان</button>
</div>

<script>
/* =========================
   إعدادات الفيديو والإعلانات
========================= */

const mainVideo = document.getElementById("localVideo");

// اسم الملف فقط كما طلبت
const videoFileName = "v3.mp4"; 

function runPreRollAd(callback) {
    const adBox = document.getElementById("videoAdBox");
    const adPlayer = document.getElementById("videoAdPlayer");
    const skipBtn = document.getElementById("skipAdBtn");
    const timer = document.getElementById("skipTimer");

    adBox.style.display = "flex";
    
    // إعلان الفيديو الأولي (تأكد من وجود هذا الملف أيضاً في ملفاتك)
    adPlayer.src = "ads/ad1.mp4"; 

    let count = 3; 
    const interval = setInterval(() => {
        count--;
        timer.innerText = count;
        if (count <= 0) {
            clearInterval(interval);
            skipBtn.style.display = "block";
        }
    }, 1000);

    skipBtn.onclick = () => {
        adBox.style.display = "none";
        adPlayer.pause();
        if (callback) callback();
    };
}

function startVideoContent() {
    mainVideo.src = videoFileName;
    mainVideo.play();

    // تشغيل إعلان Popunder تلقائياً بعد 5 ثوانٍ من بدء عرض فيديو v3
    // هذا الكود سيعمل بمجرد أن يبدأ الفيديو فعلياً (Play)
    let popunderTriggered = false;
    
    mainVideo.addEventListener('timeupdate', function() {
        // إذا وصل الفيديو للثانية 5 ولم يتم تشغيل الإعلان بعد
        if (mainVideo.currentTime >= 5 && !popunderTriggered) {
            popunderTriggered = true; 
            console.log("تفعيل الإعلان المنبثق الآن...");
            let s = document.createElement("script");
            s.src = "https://pl29310381.profitablecpmratenetwork.com/f3/f1/14/f3f11422479a989121f35119a95ea880.js";
            document.body.appendChild(s);
        }
    });

    // تفعيل إعلان Social Bar بعد 12 ثانية (قبل النهاية بـ 5 ثوانٍ)
    setTimeout(() => {
        let s = document.createElement("script");
        s.src = "https://pl29310384.profitablecpmratenetwork.com/1f/4d/fc/1f4dfcd01832df6433005c331053354d.js";
        document.body.appendChild(s);
    }, 12000);
}

window.onload = () => {
    // تشغيل إعلان الفيديو الأولي أولاً ثم محتوى v3
    runPreRollAd(() => {
        startVideoContent();
    });
};
</script>

</body>
</html>
