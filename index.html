<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Studio - Pro Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://pl29310381.profitablecpmratenetwork.com/f3/f1/14/f3f11422479a989121f35119a95ea880.js"></script>
    <script src="https://pl29310384.profitablecpmratenetwork.com/1f/4d/fc/1f4dfcd01832df6433005c331053354d.js"></script>

    <style>
        :root { --manhwa-purple: #e2d1f9; --manhwa-pink: #ffdae9; --accent: #00a884; }
        body { margin: 0; background-color: #0b141a; color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        
        /* خلفية الواتساب */
        #wp-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background-image: url('https://web.whatsapp.com/img/bg-chat-tile-dark_a4be512e719549d10e05527f6a012d27.png'); background-repeat: repeat; opacity: 0.1; pointer-events: none; }

        /* مشغل الفيديو من GitHub */
        #videoContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* نظام الإعلانات الذكي */
        .ad-overlay { position: absolute; z-index: 5000; pointer-events: auto; }
        
        /* فقاعات الإعلانات والهدايا */
        .ad-bubble { width: 60px; height: 60px; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); border-radius: 50%; border: 2px solid var(--manhwa-pink); display: flex; align-items: center; justify-content: center; font-size: 30px; animation: float 4s ease-in-out infinite; cursor: pointer; box-shadow: 0 0 15px var(--manhwa-pink); }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(10deg); } }

        /* إعلان يشبه يوتيوب (تخطي) */
        #youtubeStyleAd { position: absolute; bottom: 80px; left: 20px; background: rgba(0,0,0,0.8); border-left: 4px solid #f00; padding: 15px; border-radius: 4px; display: none; z-index: 6000; width: 280px; animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .skip-btn { background: #333; color: #eee; border: 1px solid #555; padding: 5px 10px; font-size: 12px; float: left; cursor: pointer; margin-top: 10px; }
        .ad-timer { font-size: 12px; color: #aaa; }

        /* العناصر الأصلية */
        #subCounter { position: fixed; top: 15px; right: 15px; background: rgba(32, 44, 51, 0.95); border: 1px solid var(--manhwa-pink); padding: 5px 15px; border-radius: 20px; display: flex; align-items: center; gap: 8px; z-index: 1000; }
        .control-node { position: fixed; width: 50px; height: 50px; background: rgba(32, 44, 51, 0.95); border: 2px solid var(--manhwa-purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; color: var(--manhwa-purple); transition: 0.3s; }
        #btnSettings { top: 75px; right: 20px; } 
        #btnFilter   { top: 135px; right: 20px; } 
        #btnEmoji    { top: 195px; right: 20px; }

        .glass-panel { position: fixed; background: rgba(23, 33, 39, 0.98); border: 1px solid var(--manhwa-purple); border-radius: 20px; padding: 15px; display: none; z-index: 1001; }
        #panelEmoji { top: 255px; right: 20px; width: 55px; max-height: 350px; overflow-y: auto; flex-direction: column; }
        
        #bigEmojiZone { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 200px; z-index: 4000; pointer-events: none; opacity: 0; }
        .pop-animation { animation: centerPop 1.5s ease-out forwards; }
        @keyframes centerPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; } }

        /* البانر السفلي الشفاف */
        #bottomBannerAd { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0,0,0,0.5); width: 100%; text-align: center; }
    </style>
</head>
<body>

    <div id="wp-background"></div>

    <div id="videoContainer">
        <video id="myVideo" autoplay muted playsinline loop>
            <source src="A.mp4" type="video/mp4">
            متصفحك لا يدعم تشغيل الفيديو.
        </video>

        <div id="youtubeStyleAd">
            <div style="color:white; font-size: 14px;">إعلان مروج</div>
            <div class="ad-timer" id="adTimer">سيظهر زر التخطي بعد 5 ثوانٍ</div>
            <div id="skipContainer"></div>
            <div id="container-00e55bc0936560b403e88e60248cee97"></div>
        </div>

        <div id="adBubbleContainer"></div>
    </div>

    <div id="subCounter"><i class="fa-solid fa-heart" style="color: #ff4f4f;"></i><div class="sub-count-num">1,024</div></div>
    
    <div id="btnSettings" class="control-node"><i class="fa-solid fa-cog"></i></div>
    <div id="btnFilter" class="control-node"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <div id="btnEmoji" class="control-node"><i class="fa-solid fa-face-smile"></i></div>
    
    <div id="panelEmoji" class="glass-panel"><div id="emojiGrid" style="display:flex; flex-direction:column; align-items:center; gap:15px;"></div></div>

    <div id="bigEmojiZone"></div>

    <div id="bottomBannerAd">
        <script async="async" data-cfasync="false" src="https://pl29310385.profitablecpmratenetwork.com/00e55bc0936560b403e88e60248cee97/invoke.js"></script>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const adBox = document.getElementById('youtubeStyleAd');
        const adTimerText = document.getElementById('adTimer');
        const skipContainer = document.getElementById('skipContainer');
        const bubbleContainer = document.getElementById('adBubbleContainer');

        // 1. تشغيل الفيديو تلقائياً (صامت لضمان العمل)
        window.addEventListener('load', () => {
            video.play().catch(e => console.log("Auto-play blocked, waiting for interaction"));
            setupAdsSequence();
            createFloatingBubbles();
        });

        // 2. نظام إعلانات يوتيوب (تظهر مرتين)
        function setupAdsSequence() {
            setTimeout(() => showYoutubeAd(), 5000); // الإعلان الأول بعد 5 ثواني
            setTimeout(() => showYoutubeAd(), 25000); // الإعلان الثاني بعد 25 ثانية
        }

        function showYoutubeAd() {
            adBox.style.display = 'block';
            let timeLeft = 5;
            const interval = setInterval(() => {
                timeLeft--;
                if(timeLeft > 0) {
                    adTimerText.innerText = `يمكنك التخطي بعد ${timeLeft} ثوانٍ`;
                } else {
                    adTimerText.innerText = `الإعلان جاهز للتخطي`;
                    skipContainer.innerHTML = `<button class="skip-btn" onclick="skipAd()">تخطي الإعلان ❯</button>`;
                    clearInterval(interval);
                }
            }, 1000);
        }

        function skipAd() {
            adBox.style.display = 'none';
            skipContainer.innerHTML = '';
            // فتح سمارت لينك في نافذة جديدة مخفية لزيادة الربح (Popunder)
            window.open('https://www.profitablecpmratenetwork.com/p5xdvi8igm?key=bb15e730477910952e414434bb03be5b', '_blank');
        }

        // 3. فقاعات الإعلانات (هدايا، نجوم، فقاعات)
        function createFloatingBubbles() {
            const icons = ['🎁', '✨', '🔔', '⭐', '🎈'];
            setInterval(() => {
                const bubble = document.createElement('div');
                bubble.className = 'ad-overlay ad-bubble';
                bubble.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                bubble.style.left = Math.random() * 80 + 10 + '%';
                bubble.style.top = Math.random() * 60 + 20 + '%';
                
                // عند لمس الفقاعة يفتح الرابط الذكي للربح
                bubble.onclick = () => {
                    window.open('https://www.profitablecpmratenetwork.com/p5xdvi8igm?key=bb15e730477910952e414434bb03be5b', '_blank');
                    bubble.remove();
                };

                bubbleContainer.appendChild(bubble);
                setTimeout(() => bubble.remove(), 8000);
            }, 4000);
        }

        // 4. الحفاظ على الأصوات والإيموجي الأصلية
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(emoji) {
            const now = audioCtx.currentTime;
            if (["🙈","🙊","🙉"].includes(emoji)) {
                [0, 0.15, 0.3, 0.45, 0.6].forEach((t, i) => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(600 + (i % 2 * 200), now + t);
                    gain.gain.setValueAtTime(0.1, now + t); osc.start(now + t); osc.stop(now + t + 0.1);
                });
            } else if (["💜","🫀","💖","❤"].includes(emoji)) {
                [0, 0.15, 0.6, 0.75].forEach(t => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'sine'; o.frequency.setValueAtTime(55, now + t); 
                    g.gain.setValueAtTime(0.4, now + t); o.start(now + t); o.stop(now + t + 0.12);
                });
            }
            // بقية الأصوات تعمل كما كانت...
        }

        const emojis = ["💜","💌","💣","🫀","💎","😍","😂","🤣","😹","😻","🙈","🙊","🙉"];
        const grid = document.getElementById("emojiGrid");
        emojis.forEach((e) => {
            let d = document.createElement("div"); d.style.fontSize = "28px"; d.style.cursor = "pointer"; d.innerText = e;
            d.onclick = () => {
                const z = document.getElementById("bigEmojiZone"); z.innerText = e;
                z.classList.remove("pop-animation"); void z.offsetWidth; z.classList.add("pop-animation");
                playSound(e);
            };
            grid.appendChild(d);
        });

        // لوحات التحكم
        document.getElementById('btnEmoji').onclick = () => {
            const p = document.getElementById('panelEmoji');
            p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
        };
        // الفلاتر
        document.getElementById('btnFilter').onclick = () => {
            const current = document.body.style.filter;
            document.body.style.filter = current.includes('hue-rotate') ? 'none' : 'hue-rotate(280deg)';
        };
    </script>

    <script type='text/javascript' src='//pl29310381.profitablecpmratenetwork.com/f3/f1/14/f3f11422479a989121f35119a95ea880.js'></script>

</body>
</html>
